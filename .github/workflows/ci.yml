name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, offline E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MOCK_LLM: "1"  # CI never calls Gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Import check
        run: python -c "import app.main"
      - name: Tests (unit, API, synthetic end-to-end pipeline)
        run: pytest -v

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Google API keys or .env files committed
        run: |
          if git grep -nE "AIza[0-9A-Za-z_-]{35}"; then echo "::error::Google API key committed"; exit 1; fi
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env file committed"; exit 1; fi
